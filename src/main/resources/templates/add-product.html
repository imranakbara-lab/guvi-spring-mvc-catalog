<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><title>Add Product</title></head>
<body class="bg-light">
<div class="container py-5" style="max-width:560px">
  <h2 class="mb-4">Product Info</h2>
  <form class="card card-body shadow-sm" th:action="@{/products/save}" th:object="${product}" method="post">
    <div class="mb-3">
      <label class="form-label" for="name">Product Name</label>
      <input class="form-control" id="name" th:field="*{name}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="price">Price</label>
      <input class="form-control" id="price" type="number" step="0.01" min="0" th:field="*{price}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="category">Category</label>
      <input class="form-control" id="category" th:field="*{category}" placeholder="e.g. Electronics" required>
    </div>
    <button class="btn btn-primary" type="submit">Submit</button>
    <a class="btn btn-link" th:href="@{/}">Back</a>
  </form>
</div>
</body>
</html>
