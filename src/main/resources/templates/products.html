<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><title>Products</title></head>
<body class="bg-light">
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Product Catalog</h2>
    <div><a class="btn btn-primary" th:href="@{/products/add}">Add Product</a> <a class="btn btn-outline-secondary" th:href="@{/}">Home</a></div>
  </div>
  <div class="alert alert-success" th:if="${param.saved}">Product saved successfully.</div>

  <form class="row g-2 mb-3" th:action="@{/products}" method="get">
    <div class="col-auto">
      <select class="form-select" name="category">
        <option value="">All categories</option>
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == selectedCategory}"></option>
      </select>
    </div>
    <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Filter</button></div>
  </form>

  <table class="table table-bordered table-striped bg-white">
    <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th></tr></thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></td>
        <td th:text="${p.category}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(products)}"><td colspan="4" class="text-center text-muted">No products found</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
