<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><title>Book Feedback</title></head>
<body class="bg-light">
<div class="container py-5" style="max-width:560px">
  <h2 class="mb-4">Book Feedback</h2>
  <form class="card card-body shadow-sm" th:action="@{/saveFeedback}" th:object="${feedbackForm}" method="post">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" th:field="*{name}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="bookName">Book Name</label>
      <input class="form-control" id="bookName" th:field="*{bookName}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="feedback">Feedback</label>
      <textarea class="form-control" id="feedback" rows="4" th:field="*{feedback}" required></textarea>
    </div>
    <button class="btn btn-success" type="submit">Submit</button>
  </form>
</div>
</body>
</html>
