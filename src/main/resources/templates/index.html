<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><title>Product Catalog</title></head>
<body class="bg-light">
<div class="container py-5 text-center">
  <h1 class="mb-2">Product Catalog</h1>
  <p class="text-muted mb-5">Choose an option</p>
  <div class="row justify-content-center g-4">
    <div class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/products/add}">
        <div class="card-body py-5"><h3>1. Add Product</h3><p class="text-muted mb-0">Enter name, price and category</p></div>
      </a>
    </div>
    <div class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/products}">
        <div class="card-body py-5"><h3>2. Display Product</h3><p class="text-muted mb-0">View all products in a table</p></div>
      </a>
    </div>
  </div>
  <p class="mt-5"><a th:href="@{/feedback}">Give feedback</a></p>
</div>
</body>
</html>
